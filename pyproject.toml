[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disclosure-agent"
version = "0.1.0"
description = "DART disclosure AI agent project scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi",
    "httpx",
    "lxml",
    "numpy",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["disclosure_agent"]
